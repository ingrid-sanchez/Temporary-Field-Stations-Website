    <img src="Avatar/sticker.png" id="idle-sticker" alt="Help Sticker">

  </div>

  <!-- Popup Modal -->
  <div id="regionModal" class="modal">
  
    <!-- NEW ECOREGION INFO BOX -->
    <div id="ecoBox" class="eco-box">
      <img id="ecoGraphic" class="eco-graphic" alt="">
      <span id="ecoClose" class="eco-close">×</span>
      <h2 id="ecoHeader" class="eco-header"></h2>
  <div class="eco-content">

        <div class="eco-image-wrapper">
          <img id="ecoImage" class="eco-image" alt="">
          <!-- More-info button -->
          <img id="ecoMoreInfo" class="eco-more-info" src="Graphics/more-info.png" alt="More Info">
          <!-- Caption box that expands from the button -->
          <div id="ecoCaptionBox" class="eco-caption-box"></div>
        </div>

        <!-- Icon Page Content -->
        <div id="iconPageSection" class="icon-page-section hidden">
          <h3 id="iconPageHeader" class="icon-page-header" style="font-size: 30px;"></h3>

          <div class="icon-page-content">
            <p id="iconPageDescription" class="icon-page-description"></p>
            <video id="iconPageVideo" class="icon-page-video" autoplay loop muted playsinline></video>
          </div>
        </div>

        <p id="ecoDescription" class="eco-description"></p>

      </div>
    </div>

<div id="stationBox" class="station-box">
  
  <div class="station-top">
    <img id="stationImage" class="station-image" src="">
  </div>

  <div class="station-bottom">
    <div class="station-text">
      <div class="station-header-row">
        <h2 id="stationHeader"></h2>
        <span id="stationLocation" class="station-location"></span>
      </div>
      <p id="stationDescription"></p>
    </div>


    <div class="station-qr-wrapper">
      <img id="stationQR" class="station-qr" src="">
    </div>
  </div>

  <button id="stationClose" class="station-close">×</button>

</div>



    <!-- OLD PNG POPUP (still used for field stations only) -->
    <img id="popupImage" class="popup-image" src="" alt="Region Popup">

    <!-- Secondary overlay image -->
    <img id="detailImage" class="detail-image" src="" alt="Detail Popup">

    <!-- Icon strip PNG -->
    <div id="iconStrip" class="icon-strip">
      <div class="icon-strip-inner">
        <img class="icon-item" data-category="soils" src="Graphics/Icon Strips/Icons/soils.png">
        <img class="icon-item" data-category="topography" src="Graphics/Icon Strips/Icons/topography.png">
        <img class="icon-item" data-category="precipitation" src="Graphics/Icon Strips/Icons/precipitation.png">
        <img class="icon-item" data-category="temperature" src="Graphics/Icon Strips/Icons/temperature.png">
        <img class="icon-item" data-category="industry" src="Graphics/Icon Strips/Icons/industry.png">
        <img class="icon-item" data-category="species" src="Graphics/Icon Strips/Icons/species.png">
      </div>
    </div>



    <!-- icon strip svg map-->
    <map name="icon-map" id="iconMap">
      <area target="" alt="soils" title="soils" href="" coords="16,6,108,103" shape="rect">
      <area target="" alt="industry" title="industry" href="" coords="111,7,231,103" shape="rect">
      <area target="" alt="temperature" title="temperature" href="" coords="234,7,339,103" shape="rect">
      <area target="" alt="topography" title="topography" href="" coords="342,8,479,103" shape="rect">
      <area target="" alt="species" title="species" href="" coords="483,9,640,103" shape="rect">
    </map>

  </div>

  <!-- Idle / Inactivity Overlay -->
  <div id="idle-overlay" class="hidden">
    <div class="idle-dim"></div>
    <img src="Avatar/idle1.png" class="idle-title" alt="Idle Title">
    <div id="idle-box" class="idle-box"></div>
  </div>

  <script src="script.js"></script>
